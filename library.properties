sentence=SmartMatrix 4.0.3 with Arduino-ESP32 core 2.x build support
paragraph=Fork of pixelmatix/SmartMatrix 4.0.3 (MIT). Two additive changes: three #includes in src/esp32_i2s_parallel.c so the ESP32 I2S-parallel build works on Arduino-ESP32 core 2.x, verified on 2.0.17, and restoration of the AZSMZ_ESP32Matrix_v12/v15 pinouts that 4.0 dropped. Core 3.x is NOT verified and may need more work. No functional, structural, or API changes to the display path; Teensy support is byte-for-byte unchanged. Original project: http://docs.pixelmatix.com/SmartMatrix --- See README.md in this library for the full change list, 3.x migration notes, and hardware verification.
